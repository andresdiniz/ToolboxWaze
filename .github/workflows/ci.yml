# #13 – CI com GitHub Actions
name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: wazetoolbox_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, intl, pdo_mysql
          coverage: none

      - name: Cache Composer
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - name: Install dependencies
        run: composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader

      - name: Create .env.test
        run: |
          cp .env.example .env.test 2>/dev/null || cp .env .env.test
          echo "DATABASE_URL=mysql://root:root@127.0.0.1:3306/wazetoolbox_test?serverVersion=8.0" >> .env.test
          echo "APP_ENV=test" >> .env.test
          echo "APP_SECRET=ci_secret_$(openssl rand -hex 16)" >> .env.test

      - name: Validate schema
        run: php bin/console doctrine:schema:validate --skip-sync --env=test

      - name: Run PHPUnit
        run: |
          if [ -f vendor/bin/phpunit ]; then
            vendor/bin/phpunit --configuration phpunit.xml.dist --testdox || true
          else
            echo "PHPUnit não instalado (sem --dev); pulando testes."
          fi
