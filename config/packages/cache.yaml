framework:
    cache:
        # Unique name of your app: used to compute stable namespaces for cache keys.
        #prefix_seed: your_vendor_name/app_name

        # Hospedagem compartilhada: usar filesystem explicitamente.
        # Evita que pools de cache (doctrine.result_cache_pool, doctrine.system_cache_pool)
        # abram conexões extras com o banco de dados.
        app: cache.adapter.filesystem
        system: cache.adapter.system

        # Redis (desabilitado — não disponível em hospedagem compartilhada Hostinger)
        #app: cache.adapter.redis
        #default_redis_provider: redis://localhost

        # APCu (não recomendado para workloads com muita escrita aleatória)
        #app: cache.adapter.apcu
