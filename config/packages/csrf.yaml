# Proteção CSRF para formulários
# IMPORTANTE: NÃO usar stateless_token_ids para 'authenticate' ou 'logout'
# pois o modo double-submit cookie falha em hospedagem compartilhada (Hostinger)
# O token é validado via sessão PHP (configurado em framework.yaml)
framework:
    form:
        csrf_protection:
            token_id: submit
