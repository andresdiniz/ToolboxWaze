doctrine:
    dbal:
        url: '%env(resolve:DATABASE_URL)%'

        # IMPORTANTE: Configure a versão do servidor para evitar queries extras de detecção.
        # Prefira declarar direto na DATABASE_URL do .env:
        #   DATABASE_URL="mysql://user:pass@host/db?serverVersion=8.0&charset=utf8mb4"
        # Ou descomente abaixo:
        #server_version: '8.0'

        # Desativado fixo: com true o Doctrine guarda backtrace de CADA query
        # em memória (BacktraceDebugDataHolder). Em imports grandes (>10k rows)
        # isso esgota a RAM mesmo com memory_limit=2G.
        profiling_collect_backtrace: false

        use_savepoints: true

        # --- Proteção contra max_connections em hospedagem compartilhada ---
        # Nunca reutilizar conexões persistentes entre requests PHP-FPM.
        # Conexões persistentes acumulam slots no MySQL e causam "Too many connections".
        persistent: false

        options:
            # PDO::ATTR_TIMEOUT = 0 — desistir de conectar após 5s.
            # Libera o worker PHP mais rápido em caso de lentidão do DB.
            # NOTA: connect_timeout não é opção direta do doctrine-bundle;
            # deve ser passado via PDO options para evitar InvalidConfigurationException.
            0: 5

            # PDO::MYSQL_ATTR_INIT_COMMAND = 1002
            # Forçar wait_timeout baixo: MySQL fecha conexões ociosas em 28s.
            # Evita conexões "zumbis" que ocupam slots sem uso.
            1002: "SET SESSION wait_timeout=28, interactive_timeout=28"

    orm:
        auto_generate_proxy_classes: true
        enable_lazy_ghost_objects: true
        report_fields_where_declared: true
        validate_xml_mapping: true
        naming_strategy: doctrine.orm.naming_strategy.underscore_number_aware
        identity_generation_preferences:
            Doctrine\DBAL\Platforms\PostgreSQLPlatform: identity
        auto_mapping: true
        mappings:
            App:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Entity'
                prefix: 'App\Entity'
                alias: App
        controller_resolver:
            auto_mapping: false

when@test:
    doctrine:
        dbal:
            # "TEST_TOKEN" is typically set by ParaTest
            dbname_suffix: '_test%env(default::TEST_TOKEN)%'

when@prod:
    doctrine:
        orm:
            auto_generate_proxy_classes: false
            proxy_dir: '%kernel.build_dir%/doctrine/orm/Proxies'
            query_cache_driver:
                type: pool
                pool: doctrine.system_cache_pool
            result_cache_driver:
                type: pool
                pool: doctrine.result_cache_pool

    framework:
        cache:
            pools:
                doctrine.result_cache_pool:
                    adapter: cache.app
                doctrine.system_cache_pool:
                    adapter: cache.system
