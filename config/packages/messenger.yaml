framework:
    messenger:
        failure_transport: failed

        transports:
            # Fila principal via Doctrine (banco de dados) — compativel com Hostinger shared hosting
            # Nao requer Redis, RabbitMQ ou proc_open/shell_exec
            async:
                dsn: '%env(MESSENGER_TRANSPORT_DSN)%'
                options:
                    use_notify: false   # desabilita LISTEN/NOTIFY do Postgres; funciona com MySQL
                    auto_setup: true    # cria tabela messenger_messages automaticamente
                retry_strategy:
                    max_retries: 2
                    delay: 5000
                    multiplier: 2

            failed:
                dsn: 'doctrine://default?queue_name=failed'

            sync:
                dsn: 'sync://'

        routing:
            App\Message\ImportRadaresMessage: async
