framework:
    messenger:
        failure_transport: failed

        transports:
            # sync:// executa o handler imediatamente, sem fila e sem worker separado.
            # Necessário para versões antigas do MariaDB (< 10.6) que não suportam SKIP LOCKED.
            # Para produção com MySQL 8+ / MariaDB 10.6+, troque por:
            #   async:
            #     dsn: '%env(MESSENGER_TRANSPORT_DSN)%'
            #     options:
            #       use_notify: true
            async: 'sync://'

            failed: 'doctrine://default?queue_name=failed'

        default_bus: messenger.bus.default

        buses:
            messenger.bus.default: []

        routing:
            Symfony\Component\Mailer\Messenger\SendEmailMessage: async
            Symfony\Component\Notifier\Message\ChatMessage: async
            Symfony\Component\Notifier\Message\SmsMessage: async
            App\Message\ImportFuelResellersMessage: async
