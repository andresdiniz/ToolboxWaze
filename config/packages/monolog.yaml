monolog:
    channels:
        - deprecation  # Deprecations are logged in the dedicated "deprecation" channel when it exists
        - email_queue  # Canal dedicado para todos os e-mails e fila do Messenger

when@dev:
    monolog:
        handlers:
            main:
                type: stream
                path: "%kernel.logs_dir%/%kernel.environment%.log"
                level: debug
                channels: ["!event"]
            console:
                type: console
                process_psr_3_messages: false
                channels: ["!event", "!doctrine", "!console"]
            # Log dedicado para e-mails e fila — facilita auditoria sem poluir o log principal
            email_queue:
                type: stream
                path: "%kernel.logs_dir%/email_queue.log"
                level: debug
                channels: [email_queue]

when@test:
    monolog:
        handlers:
            main:
                type: fingers_crossed
                action_level: error
                handler: nested
                excluded_http_codes: [404, 405]
                channels: ["!event"]
            nested:
                type: stream
                path: "%kernel.logs_dir%/%kernel.environment%.log"
                level: debug
            email_queue:
                type: stream
                path: "%kernel.logs_dir%/email_queue.log"
                level: debug
                channels: [email_queue]

when@prod:
    monolog:
        handlers:
            main:
                type: fingers_crossed
                action_level: error
                handler: nested
                excluded_http_codes: [404, 405]
                channels: ["!deprecation"]
                buffer_size: 50
            nested:
                type: stream
                path: php://stderr
                level: debug
                formatter: monolog.formatter.json
            console:
                type: console
                process_psr_3_messages: false
                channels: ["!event", "!doctrine"]
            deprecation:
                type: stream
                channels: [deprecation]
                path: php://stderr
                formatter: monolog.formatter.json
            # Em prod: arquivo dedicado para todos os eventos de e-mail/fila
            email_queue:
                type: stream
                path: "%kernel.logs_dir%/email_queue.log"
                level: info
                channels: [email_queue]
                formatter: monolog.formatter.json
