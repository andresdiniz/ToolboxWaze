security:
    # Mantenha aqui o seu provider atual, se já existir.
    providers:
        app_user_provider:
            entity:
                class: App\Entity\User
                property: email

    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js)/
            security: false

        api_wme:
            pattern: ^/api/wme/
            stateless: true
            provider: app_user_provider
            custom_authenticators:
                - App\Security\WmeDeviceAuthenticator
            entry_point: App\Security\WmeDeviceAuthenticator

        main:
            lazy: true
            provider: app_user_provider
            # Mantenha aqui o restante do seu firewall "main" atual:
            # form_login, logout, remember_me, etc.

    access_control:
        # Rotas públicas da API WME
        - { path: ^/api/wme/registrar$, roles: PUBLIC_ACCESS }
        - { path: ^/api/wme/confirmar/, roles: PUBLIC_ACCESS }

        # As demais rotas exigem token; o authenticator devolve 401 JSON.
        - { path: ^/api/wme/, roles: PUBLIC_ACCESS }