security:
    password_hashers:
        App\Entity\User:
            algorithm: auto

    providers:
        app_user_provider:
            entity:
                class: App\Entity\User
                property: email

    role_hierarchy:
        # ROLE_CHAMP e ROLE_ADMIN sao hierarquias SEPARADAS.
        # Admin NAO herda ROLE_CHAMP: downgrade e restrito a Champs.
        ROLE_CHAMP: ROLE_USER
        ROLE_ADMIN: ROLE_USER

    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js)/
            security: false

        main:
            lazy: true
            provider: app_user_provider
            entry_point: App\Security\AppAuthenticator
            custom_authenticators:
                - App\Security\AppAuthenticator
                - App\Security\GoogleAuthenticator

            login_throttling:
                max_attempts: 5
                interval: '15 minutes'
                
            logout:
                path: app_logout
                target: app_login
            remember_me:
                secret: '%kernel.secret%'
                lifetime: 604800 # 7 dias
                path: /

    access_control:
        - { path: ^/login,           roles: PUBLIC_ACCESS }
        - { path: ^/register,        roles: PUBLIC_ACCESS }
        - { path: ^/forgot-password, roles: PUBLIC_ACCESS }
        - { path: ^/reset-password,  roles: PUBLIC_ACCESS }
        - { path: ^/connect,         roles: PUBLIC_ACCESS }
        - { path: ^/auth/waze-check, roles: PUBLIC_ACCESS }
        - { path: ^/admin,           roles: ROLE_ADMIN }
        - { path: ^/,                roles: ROLE_USER }
