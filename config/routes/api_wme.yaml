api_wme_bootstrap:
    path: /api/wme/bootstrap
    controller: App\Controller\Api\WmeApiController::bootstrap
    methods: [GET]

api_wme_registrar:
    path: /api/wme/registrar
    controller: App\Controller\Api\WmeApiController::registrar
    methods: [POST]

api_wme_reenviar:
    path: /api/wme/verificacao/reenviar
    controller: App\Controller\Api\WmeApiController::reenviar
    methods: [POST]

api_wme_revogar:
    path: /api/wme/dispositivo/revogar
    controller: App\Controller\Api\WmeApiController::revogar
    methods: [POST]

api_wme_confirmar:
    path: /api/wme/confirmar/{id}/{verificador}
    controller: App\Controller\Api\WmeApiController::confirmar
    methods: [GET, POST]
    requirements:
        id: '\d+'
        verificador: '[a-f0-9]{48}'

api_wme_formulario:
    path: /api/wme/formularios/{slug}
    controller: App\Controller\Api\WmeApiController::formulario
    methods: [GET]

api_wme_alteracoes:
    path: /api/wme/solicitacoes/alteracoes
    controller: App\Controller\Api\WmeApiController::alteracoes
    methods: [GET]

api_wme_minhas:
    path: /api/wme/solicitacoes
    controller: App\Controller\Api\WmeApiController::minhas
    methods: [GET]

api_wme_criar:
    path: /api/wme/solicitacoes
    controller: App\Controller\Api\WmeApiController::criar
    methods: [POST]

api_wme_status:
    path: /api/wme/solicitacoes/{id}/status
    controller: App\Controller\Api\WmeApiController::status
    methods: [GET]
    requirements:
        id: '\d+'

api_wme_envio:
    path: /api/wme/envios/{clientRequestId}
    controller: App\Controller\Api\WmeApiController::envio
    methods: [GET]

api_wme_anexo:
    path: /api/wme/solicitacoes/{id}/anexos/{nome}
    controller: App\Controller\Api\WmeApiController::anexo
    methods: [GET]
    requirements:
        id: '\d+'
        nome: '[a-f0-9]{40}\.(jpg|png|webp)'

api_wme_diagnostico_rota:
    path: /api/wme/diagnostico-rota-2142
    controller: App\Controller\Api\WmeApiController::bootstrap
    methods: [GET]        

