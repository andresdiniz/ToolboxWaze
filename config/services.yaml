# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.

parameters:
    locale: 'pt_BR'
    app.gtm_id: '%env(string:default::GTM_ID)%'
    app.mail_from: '%env(default::MAILER_FROM_EMAIL)%'
    app.mailer_from: '%env(default::MAILER_FROM_EMAIL)%'

services:
    _defaults:
        autowire: true
        autoconfigure: true

    App\\:
        resource: '../src/'
        exclude:
            - '../src/DependencyInjection/'
            - '../src/Entity/'
            - '../src/Kernel.php'
            - '../src/Tests/'

    App\\Email\\Contract\\EmailTransportInterface: '@App\\Email\\Transport\\ResendEmailTransport'
    App\\Email\\Contract\\EmailEventLoggerInterface: '@App\\Email\\Logging\\MonologEmailEventLogger'
