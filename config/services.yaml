# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.

parameters:
    # Remetente dos e-mails do sistema.
    # Defina MAILER_FROM no .env.local (ex: MAILER_FROM=sistema@seudominio.com.br)
    app.mail_from: '%env(MAILER_FROM)%'

services:
    _defaults:
        autowire: true
        autoconfigure: true
        bind:
            # Injeta MAILER_FROM em qualquer serviço que declare `string $mailFrom`
            string $mailFrom: '%app.mail_from%'

    App\:
        resource: '../src/'
        exclude:
            - '../src/DependencyInjection/'
            - '../src/Entity/'
            - '../src/Kernel.php'
