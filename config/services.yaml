# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.

parameters:

services:
    _defaults:
        autowire: true
        autoconfigure: true

    App\:
        resource: '../src/'
        exclude:
            - '../src/DependencyInjection/'
            - '../src/Entity/'
            - '../src/Kernel.php'

    # EnviarEmailSolicitacaoHandler usa #[Autowire] diretamente no construtor
    # para o canal email_queue — sem necessidade de override aqui.

    # Os handlers abaixo NÃO usam #[Autowire] no construtor,
    # por isso precisam de configuração explícita:
    App\MessageHandler\EnviarEmailContaHandler:
        arguments:
            $emailQueueLogger: '@monolog.logger.email_queue'
            $mailerFrom: '%env(MAILER_FROM)%'
            $appBaseUrl: '%env(APP_BASE_URL)%'

    App\MessageHandler\EnviarEmailRadarVencidoHandler:
        arguments:
            $emailQueueLogger: '@monolog.logger.email_queue'
            $mailerFrom: '%env(MAILER_FROM)%'
            $appBaseUrl: '%env(APP_BASE_URL)%'
