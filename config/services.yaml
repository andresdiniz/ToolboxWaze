# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.

parameters:

services:
    _defaults:
        autowire: true
        autoconfigure: true

    App\:
        resource: '../src/'
        exclude:
            - '../src/DependencyInjection/'
            - '../src/Entity/'
            - '../src/Kernel.php'

    # ---------------------------------------------------------------
    # Controllers
    # ---------------------------------------------------------------

    # $mailFrom não pode ser autowired (é string) — injeção explícita necessária
    App\Controller\RegistrationController:
        arguments:
            $mailFrom: '%env(MAILER_FROM)%'

    # ---------------------------------------------------------------
    # MessageHandlers
    # EnviarEmailSolicitacaoHandler usa #[Autowire] no construtor (auto).
    # Os demais precisam de configuração explícita abaixo.
    # ---------------------------------------------------------------

    App\MessageHandler\EnviarEmailContaHandler:
        arguments:
            $emailQueueLogger: '@monolog.logger.email_queue'
            $mailerFrom: '%env(MAILER_FROM)%'
            # $urlGenerator e $userRepo são autowired automaticamente

    App\MessageHandler\EnviarEmailRadarVencidoHandler:
        arguments:
            $emailQueueLogger: '@monolog.logger.email_queue'
            $mailerFrom: '%env(MAILER_FROM)%'
            $appBaseUrl: '%env(APP_BASE_URL)%'
