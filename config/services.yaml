# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.

parameters:
    # ID do container GTM (ex: GTM-XXXXXX). Deixe vazio para desabilitar o snippet.
    # Defina GTM_ID no .env.local — nunca commite o ID real no repositório.
    app.gtm_id: '%env(string:default::GTM_ID)%'

services:
    _defaults:
        autowire: true
        autoconfigure: true

    App\:
        resource: '../src/'
        exclude:
            - '../src/DependencyInjection/'
            - '../src/Entity/'
            - '../src/Kernel.php'

    # ---------------------------------------------------------------
    # Controllers
    # ---------------------------------------------------------------

    # AdminUserController: emailQueueLogger não é autowired (canal customizado)
    App\Controller\AdminUserController:
        arguments:
            $emailQueueLogger: '@monolog.logger.email_queue'

    # ---------------------------------------------------------------
    # MessageHandlers
    # ---------------------------------------------------------------

    App\MessageHandler\EnviarEmailContaHandler:
        arguments:
            $emailQueueLogger: '@monolog.logger.email_queue'
            $mailerFrom:       '%env(MAILER_FROM)%'
            $appBaseUrl:       '%env(APP_BASE_URL)%'

    App\MessageHandler\EnviarEmailRadarVencidoHandler:
        arguments:
            $emailQueueLogger: '@monolog.logger.email_queue'
            $mailerFrom:       '%env(MAILER_FROM)%'
            $appBaseUrl:       '%env(APP_BASE_URL)%'
