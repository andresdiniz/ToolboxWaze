parameters:
    locale: 'pt_BR'
    app.gtm_id: '%env(string:default::GTM_ID)%'
    app.mail_from: '%env(default::MAILER_FROM_EMAIL)%'
    app.mailer_from: '%env(default::MAILER_FROM_EMAIL)%'
    app.mailer_from_full: '%env(string:MAILER_FROM)%'
    app.maptiler_key: '%env(MAPTILER_KEY)%'

services:
    _defaults:
        autowire: true
        autoconfigure: true

    App\:
        resource: '../src/'
        exclude:
            - '../src/DependencyInjection/'
            - '../src/Entity/'
            - '../src/Kernel.php'

    App\Security\AppAuthenticator:
        autowire: true
        autoconfigure: true

    App\Security\GoogleAuthenticator:
        autowire: true
        autoconfigure: true

    App\Security\ApiTokenAuthenticator:
        autowire: true
        autoconfigure: true

    App\Email\Transport\ResendEmailTransport:
        autowire: true
        autoconfigure: true
        bind:
            string $apiKey: '%env(string:default::RESEND_API_KEY)%'
            string $from: '%env(string:default::MAILER_FROM_EMAIL)%'
